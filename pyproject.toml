[tool.poetry]
name = "axis-bio"
version = "0.2.0.dev0"
description = "AI for Axial Spondyloarthritis Insights & Solutions"
authors = ["João Pais", "Diana Koshman"]
license = "Apache-2.0"
homepage = "https://github.com/JPais7/AXIS"
repository = "https://github.com/JPais7/AXIS"
readme = "README.md"
packages = [{ include = "axis" }]
include = ["axis/resources/demo/*.tsv", "axis/resources/demo/*.json"]
keywords = [
    "bioinformatics",
    "transcriptomics",
    "meta-analysis",
    "drug-discovery",
    "axial-spondyloarthritis",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[tool.poetry.scripts]
axis = "axis.cli.main:app"

[tool.poetry.dependencies]
python = "^3.12"
duckdb = ">=1.3,<2.0"
pytz = ">=2025.2"
httpx = ">=0.28,<1.0"
typer = ">=0.16,<1.0"
rich = ">=14,<15"
numpy = ">=2.3,<3.0"
scipy = ">=1.16,<2.0"
matplotlib = ">=3.10,<4.0"

[tool.poetry.group.dev.dependencies]
mypy = "^1.17"
pytest = "^8.4"
ruff = "^0.12"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["axis"]
