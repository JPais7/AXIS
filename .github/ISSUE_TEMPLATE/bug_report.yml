name: Bug report
description: Report a reproducible software problem in AXIS.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, identifiable participants or controlled data.
  - type: input
    id: version
    attributes:
      label: AXIS version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and Python version
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and minimal inputs
      render: shell
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior and complete error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
