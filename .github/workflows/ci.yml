name: AXIS checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install AXIS and development checks
        run: python -m pip install --upgrade pip && python -m pip install -e . pytest ruff mypy

      - name: Run synthetic offline demonstration
        run: axis demo

      - name: Run tests
        run: python -m pytest -q

      - name: Benchmark synthetic demonstration
        run: axis benchmark --repetitions 10 --warmups 1

      - name: Upload benchmark report
        uses: actions/upload-artifact@v6
        with:
          name: axis-benchmark-${{ matrix.os }}-python-3.12
          path: |
            benchmark-output/benchmark-report.json
            benchmark-output/benchmark-runs.tsv
          if-no-files-found: error
          retention-days: 90

      - name: Check formatting and lint rules
        if: runner.os == 'Linux'
        run: ruff check axis tests

      - name: Check types
        if: runner.os == 'Linux'
        run: mypy axis
